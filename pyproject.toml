[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffrefine"
version = "0.1.0"
description = "Small-molecule force field parameter refinement (torsions and charges)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.scripts]
ffrefine = "ffrefine.cli:main"

[project.optional-dependencies]
dev = ["pytest", "black"]

[tool.setuptools.packages.find]
include = ["ffrefine*"]

[tool.black]
line-length = 100
# Without this, black infers a target from the source and warns
# "Python 3.11 cannot parse code formatted for Python 3.15" on every run
# before passing. requires-python is >=3.10, so pin the floor.
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_gmx: requires a working gmx binary"]
